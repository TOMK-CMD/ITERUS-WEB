name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Manifest mode: release-please-config.json + .release-please-manifest.json at the root
# (root package.json is the released package; apps/web/package.json is bumped as an extra file).
# Skips gracefully while the manifest is missing — the same bootstrap-phase pattern as ci.yml.
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f .release-please-manifest.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::No .release-please-manifest.json yet — bootstrap phase, release-please skipped"; fi
      - uses: googleapis/release-please-action@v4
        if: steps.detect.outputs.ready == 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
